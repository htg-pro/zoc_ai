[project]
name = "zoc-studio-workspace"
version = "0.0.2"
description = "Workspace root for Zoc AI Python packages."
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["services/gateway", "packages/shared-types/python", "python/zocai_evolution"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy", "testsprite_tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# E501: line length handled by formatter.
# B008: FastAPI's `Depends()`/`Query()` in argument defaults is the idiomatic,
#       documented pattern — not a real mutable-default bug.
# RUF002/RUF003: ambiguous-unicode in docstrings/comments (en-dashes/arrows) is
#       intentional prose.
# UP042: `class X(str, Enum)` is valid and used for Pydantic compatibility.
ignore = ["E501", "B008", "RUF002", "RUF003", "UP042"]

[tool.ruff.lint.per-file-ignores]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["legacy/"]

[tool.pytest.ini_options]
# `scripts/tests` carries the Build_Gate guards for the Python gate scripts —
# the dependency-policy lockfile scan (zoc-agent-chat-rebuild R5.4, R22.5).
# `packages/shared-types/python/tests` carries the Message_Part contract tests
# and the schema-drift guard (R7.4, R22.5), which is the other half of the same
# gate. A guard that pytest does not collect is not a guard.
testpaths = [
  "services/gateway/tests",
  "scripts/tests",
  "packages/shared-types/python/tests",
]
addopts = "-q"
